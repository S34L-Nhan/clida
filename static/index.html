<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CLIDA</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="Chats">
      <div class="sidebar-inner">
        <div class="side-head">
          <button class="icon-btn" data-action="toggle-sidebar" data-i18n-label="sidebar.collapse" data-keys="B" data-icon="panel"></button>
          <span class="brand">CLIDA</span>
          <button class="icon-btn" data-action="new-folder" data-i18n-label="folder.new" data-icon="folderPlus"></button>
        </div>
        <button class="new-chat" data-action="new-chat" data-i18n-label="chat.new" data-keys="O"><span data-icon="plus"></span><span data-i18n="chat.new">Neuer Chat</span></button>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" data-i18n-placeholder="search.placeholder" placeholder="Chats durchsuchen" autocomplete="off" spellcheck="false">
        </label>
        <nav id="session-list" class="session-list"></nav>
        <div class="side-foot">
          <button class="side-btn" data-action="settings"><span data-icon="settings"></span><span data-i18n="settings">Einstellungen</span></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="tabbar">
        <div class="rail">
          <button class="icon-btn" data-action="toggle-sidebar" data-i18n-label="sidebar.expand" data-keys="B" data-icon="panel"></button>
        </div>
        <div id="tabs" class="tabs" role="tablist"></div>
        <button class="icon-btn tab-new" data-action="new-chat" data-i18n-label="chat.new" data-keys="O" data-icon="add"></button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="views" class="views">
        <div id="drop-hint" class="drop-hint" hidden></div>
        <div id="empty" class="empty">
          <h1 data-i18n="empty.title">Womit legen wir los?</h1>
          <p><span data-i18n="empty.text">Starte einen neuen Chat oder öffne links einen früheren.</span><br><span data-i18n="empty.background">Laufende Sessions arbeiten im Hintergrund weiter, auch wenn ihr Tab geschlossen ist.</span></p>
          <button class="btn primary" data-action="new-chat" data-i18n="chat.new">Neuer Chat</button>
          <dl id="keys" class="keys"></dl>
        </div>
      </div>
    </main>
  </div>

  <dialog id="new-dialog" class="dialog">
    <form id="new-form" method="dialog">
      <h2 data-i18n="chat.new">Neuer Chat</h2>
      <label for="new-cwd" data-i18n="new.cwd">Arbeitsverzeichnis</label>
      <input id="new-cwd" list="cwd-list" autocomplete="off" spellcheck="false" required>
      <datalist id="cwd-list"></datalist>
      <div id="cwd-chips" class="chips"></div>
      <label for="new-title"><span data-i18n="new.title">Titel</span> <span class="muted" data-i18n="optional">(optional)</span></label>
      <input id="new-title" autocomplete="off" data-i18n-placeholder="new.titlePlaceholder" placeholder="wird sonst automatisch vergeben">
      <div id="new-folder-row">
        <label for="new-folder"><span data-i18n="new.folder">Ordner</span> <span class="muted" data-i18n="optional">(optional)</span></label>
        <select id="new-folder"></select>
      </div>
      <p id="new-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" value="cancel" data-action="close-dialog" data-i18n="cancel">Abbrechen</button>
        <button type="submit" class="btn primary" data-i18n="new.start">Starten</button>
      </div>
    </form>
  </dialog>

  <dialog id="ask-dialog" class="dialog small" aria-labelledby="ask-title" aria-describedby="ask-text">
    <h2 id="ask-title"></h2>
    <p id="ask-text"></p>
    <div class="dialog-actions">
      <button type="button" id="ask-cancel" class="btn" data-i18n="cancel">Abbrechen</button>
      <button type="button" id="ask-yes" class="btn"></button>
    </div>
  </dialog>

  <dialog id="settings-dialog" class="dialog settings" aria-labelledby="settings-title">
    <h2 id="settings-title" data-i18n="settings">Einstellungen</h2>
    <div id="settings-body"></div>
    <p id="settings-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button type="button" id="settings-done" class="btn primary" data-i18n="done">Fertig</button>
    </div>
  </dialog>

  <input id="attach-input" type="file" multiple hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
