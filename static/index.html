<!doctype html>
<html lang="de" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- An app, not a web page: no "Translate this page?" offer (Chrome and Edge read this). -->
  <meta name="google" content="notranslate">
  <title>CLIDA</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/static/themes.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="Chats">
      <div class="sidebar-inner">
        <div class="side-head">
          <button class="icon-btn" data-action="toggle-sidebar" data-i18n-label="sidebar.collapse" data-keys="toggleSidebar" data-icon="panel"></button>
          <span class="brand">CLIDA</span>
          <button class="icon-btn" data-action="new-folder" data-i18n-label="folder.new" data-icon="folderPlus"></button>
        </div>
        <button class="new-chat" data-action="new-chat" data-i18n-label="chat.new" data-keys="newChat"><span data-icon="plus"></span><span data-i18n="chat.new">Neuer Chat</span></button>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Chats durchsuchen" autocomplete="off" spellcheck="false">
        </label>
        <label class="search-mode" data-i18n-title="search.advancedHint"><input id="search-advanced" type="checkbox"> <span data-i18n="search.advanced">Erweiterte Suche</span></label>
        <nav id="session-list" class="session-list"></nav>
        <div class="side-foot">
          <div id="cost-today" class="cost-today" hidden></div>
          <button class="side-btn" data-action="settings"><span data-icon="settings"></span><span data-i18n="settings">Einstellungen</span></button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="tabbar">
        <div class="rail">
          <button class="icon-btn" data-action="toggle-sidebar" data-i18n-label="sidebar.expand" data-keys="toggleSidebar" data-icon="panel"></button>
        </div>
        <div id="tabs" class="tabs" role="tablist"></div>
        <button class="icon-btn tab-new" data-action="new-chat" data-i18n-label="chat.new" data-keys="newChat" data-icon="add"></button>
      </div>
      <div id="banner" class="banner" hidden></div>
      <div id="views" class="views">
        <div id="drop-hint" class="drop-hint" hidden></div>
        <div id="empty" class="empty">
          <h1 data-i18n="empty.title">Womit legen wir los?</h1>
          <p><span data-i18n="empty.text">Starte einen neuen Chat oder öffne links einen früheren.</span><br><span data-i18n="empty.background">Laufende Sessions arbeiten im Hintergrund weiter, auch wenn ihr Tab geschlossen ist.</span></p>
          <button class="btn primary" data-action="new-chat" data-i18n="chat.new">Neuer Chat</button>
          <dl id="keys" class="keys"></dl>
        </div>
      </div>
    </main>
  </div>

  <dialog id="new-dialog" class="dialog">
    <form id="new-form" method="dialog">
      <h2 data-i18n="chat.new">Neuer Chat</h2>
      <label for="new-cwd" data-i18n="new.cwd">Arbeitsverzeichnis</label>
      <input id="new-cwd" list="cwd-list" autocomplete="off" spellcheck="false" required>
      <datalist id="cwd-list"></datalist>
      <div id="cwd-chips" class="chips"></div>
      <label for="new-title"><span data-i18n="new.title">Titel</span> <span class="muted" data-i18n="optional">(optional)</span></label>
      <input id="new-title" autocomplete="off" data-i18n-placeholder="new.titlePlaceholder" placeholder="wird sonst automatisch vergeben">
      <div id="new-folder-row">
        <label for="new-folder"><span data-i18n="new.folder">Ordner</span> <span class="muted" data-i18n="optional">(optional)</span></label>
        <select id="new-folder"></select>
      </div>
      <label class="check-row" for="new-worktree"><input id="new-worktree" type="checkbox"> <span data-i18n="new.worktree">In eigenem Git-Worktree</span></label>
      <div id="new-worktree-box" class="worktree-choice" hidden>
        <label class="check-row" for="new-wt-new"><input id="new-wt-new" name="new-wt-mode" type="radio" value="new"> <span data-i18n="new.wtNew">Neuer Branch clida/… von</span></label>
        <input id="new-base" class="branch-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="new.basePlaceholder" data-i18n-label="new.wtNew">
        <label class="check-row" for="new-wt-existing"><input id="new-wt-existing" name="new-wt-mode" type="radio" value="existing"> <span data-i18n="new.wtExisting">Bestehender Branch</span></label>
        <input id="new-branch" class="branch-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="new.branchPlaceholder" data-i18n-label="new.wtExisting">
      </div>
      <p class="dialog-hint" data-i18n="new.worktreeHint"></p>
      <p id="new-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" value="cancel" data-action="close-dialog" data-i18n="cancel">Abbrechen</button>
        <button type="submit" class="btn primary" data-i18n="new.start">Starten</button>
      </div>
    </form>
  </dialog>

  <dialog id="move-dialog" class="dialog">
    <form id="move-form" method="dialog">
      <h2 data-i18n="move.title">In eigenen Worktree</h2>
      <p class="dialog-lead" data-i18n="move.text"></p>
      <div id="move-worktree-box" class="worktree-choice">
        <label class="check-row" for="move-wt-new"><input id="move-wt-new" name="move-wt-mode" type="radio" value="new"> <span data-i18n="new.wtNew">Neuer Branch clida/… von</span></label>
        <input id="move-base" class="branch-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="new.basePlaceholder" data-i18n-label="new.wtNew">
        <label class="check-row" for="move-wt-existing"><input id="move-wt-existing" name="move-wt-mode" type="radio" value="existing"> <span data-i18n="new.wtExisting">Bestehender Branch</span></label>
        <input id="move-branch" class="branch-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="new.branchPlaceholder" data-i18n-label="new.wtExisting">
      </div>
      <p id="move-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" value="cancel" data-action="close-dialog" data-i18n="cancel">Abbrechen</button>
        <button type="submit" class="btn primary" data-i18n="move.start">Verschieben</button>
      </div>
    </form>
  </dialog>

  <dialog id="ask-dialog" class="dialog small" aria-labelledby="ask-title" aria-describedby="ask-text">
    <h2 id="ask-title"></h2>
    <p id="ask-text"></p>
    <div class="dialog-actions">
      <button type="button" id="ask-cancel" class="btn" data-i18n="cancel">Abbrechen</button>
      <button type="button" id="ask-yes" class="btn"></button>
    </div>
  </dialog>

  <dialog id="settings-dialog" class="dialog settings" aria-labelledby="settings-title">
    <div class="dialog-head">
      <h2 id="settings-title" data-i18n="settings">Einstellungen</h2>
      <button type="button" id="settings-close" class="icon-btn" data-i18n-label="close" data-icon="x"></button>
    </div>
    <div class="settings-tabs" role="tablist">
      <button type="button" role="tab" data-settings-tab="general" data-i18n="settings.tabGeneral">Allgemein</button>
      <button type="button" role="tab" data-settings-tab="keys" data-i18n="settings.tabKeys">Tastenkürzel</button>
    </div>
    <div id="settings-body"></div>
    <div id="keys-body" class="keys-body" hidden></div>
    <p id="settings-error" class="error" role="alert"></p>
    <div id="settings-actions" class="dialog-actions">
      <button type="button" id="settings-done" class="btn primary" data-i18n="done">Fertig</button>
    </div>
    <div id="keys-actions" class="dialog-actions" hidden>
      <button type="button" id="keys-reset-all" class="btn" data-i18n="kb.resetAll">Alle zurücksetzen</button>
      <span class="spacer"></span>
      <button type="button" id="keys-discard" class="btn" data-i18n="kb.discard">Verwerfen</button>
      <button type="button" id="keys-save" class="btn primary" data-i18n="save">Speichern</button>
    </div>
  </dialog>

  <input id="attach-input" type="file" multiple hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
